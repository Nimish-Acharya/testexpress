<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html"><div class="nav-brand">AppPortal</div></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="settings.html">Settings</a></li>
      <li><a href="change-password.html" class="active">Security</a></li>
      <li><a href="logout.html">Logout</a></li>
    </ul>
    <div class="user-badge">
      <span>👤</span> Alex Turner
    </div>
  </nav>

  <main class="container" style="max-width: 600px;">
    <div class="card">
      <h2 class="page-title">Change Password</h2>
      <p class="page-subtitle">Ensure your account is using a long, random password to stay secure.</p>

      <form action="profile.html" method="GET">
        <div class="form-group">
          <label for="current-pass">Current Password</label>
          <input type="password" id="current-pass" required>
        </div>

        <div class="form-group">
          <label for="new-pass">New Password</label>
          <input type="password" id="new-pass" required>
        </div>

        <div class="form-group">
          <label for="confirm-new-pass">Confirm New Password</label>
          <input type="password" id="confirm-new-pass" required>
        </div>

        <button type="submit" class="btn">Save Changes</button>
      </form>
    </div>
  </main>
</body>
</html>
