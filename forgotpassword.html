<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="page-title" style="text-align: center;">Reset Password</h2>
      <p class="page-subtitle" style="text-align: center;">Enter your email to receive a password reset link.</p>
      
      <form action="login.html" method="GET">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="user@example.com" required>
        </div>

        <button type="submit" class="btn" id="btn">Reset Password</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="login.html">← Back to Login</a>
      </p>
    </div>
  </div>
  <script src="forgotpassword.js"></script>
</body>
</html>
