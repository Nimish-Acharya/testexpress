<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <h2 class="page-title" style="text-align: center;">Welcome Back</h2>
      <p class="page-subtitle" style="text-align: center;">Please enter your credentials to log in.</p>
      
      <form  method="POST">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" placeholder="user@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <a href="forgotpassword.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn" id="btn">Log In</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html">Create Account</a>
      </p>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
